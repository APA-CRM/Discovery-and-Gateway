name: Backend CI/CD

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  GATEWAY_IMAGE_NAME: aappaa/gateway-service
  IMAGE_TAG: ${{ (github.head_ref || github.ref_name) == 'main' && 'latest' || (github.head_ref || github.ref_name) }}


on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn clean verify

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: success() && (env.BRANCH_NAME == 'develop' || env.BRANCH_NAME == 'main')
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build the Application
        if: success() && (env.BRANCH_NAME == 'develop' || env.BRANCH_NAME == 'main')
        run:  mvn clean package -DskipTests

      - name: Build and Push API-Gateway Docker Image
        if: success() && (env.BRANCH_NAME == 'develop' || env.BRANCH_NAME == 'main')
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          push: true
          file: ./api-gateway/Dockerfile.local
          tags: ${{ env.GATEWAY_IMAGE_NAME }}:${{ env.IMAGE_TAG }}